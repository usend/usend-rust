[package]
name = "usend"
version = "1.3.0"
edition = "2021"
rust-version = "1.70"
description = "The official Rust SDK for usend, the email API for developers."
license = "MIT"
homepage = "https://usend.et/docs"
repository = "https://github.com/usend/usend-rust"
readme = "README.md"
keywords = ["usend", "email", "transactional-email", "email-api", "webhooks"]
categories = ["api-bindings", "email"]

# Only serde and serde_json are required. HTTP, SHA-256/HMAC and base64 are implemented in the
# crate. The two optional dependencies below are off by default and exist only to give you
# HTTPS: enable exactly the one you already use in your project.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }

[features]
default = []
# Blocking HTTPS transport built on ureq 2.
ureq = ["dep:ureq"]
# Blocking HTTPS transport built on reqwest::blocking.
reqwest = ["dep:reqwest"]
